<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Bedside Clock</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0f;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            height: 100dvh; /* برای موبایل‌های مدرن */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.5s ease;
        }

        /* حالت روشن (اختیاری) - با دو بار لمس صفحه فعال می‌شود */
        body.light-mode {
            background-color: #f4f4f5;
            color: #18181b;
        }
        body.light-mode .date { color: #71717a; }
        body.light-mode .seconds { color: #a1a1aa; }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* ساعت اصلی */
        .time {
            font-size: clamp(80px, 25vw, 160px);
            font-weight: 200;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            display: flex;
            align-items: baseline;
            justify-content: center;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            transition: color 0.5s ease;
        }

        .seconds {
            font-size: clamp(24px, 8vw, 48px);
            font-weight: 300;
            color: #52525b;
            margin-left: 8px;
            letter-spacing: 0;
        }

        /* بخش پایین: تاریخ و وضعیت */
        .bottom-info {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .date {
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 300;
            color: #71717a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 11px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a1a1aa;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .status-badge.active {
            color: #4ade80;
            border-color: rgba(74, 222, 128, 0.3);
            background: rgba(74, 222, 128, 0.1);
        }

        .status-badge svg {
            width: 12px;
            height: 12px;
            fill: currentColor;
        }

        /* نقطه پالس برای ثانیه‌ها */
        .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #52525b;
            border-radius: 50%;
            margin-left: 8px;
            animation: blink 1s steps(1) infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* افکت لمس برای بیدار کردن */
        .flash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }

        .flash.active {
            animation: flashAnim 0.4s ease-out;
        }

        @keyframes flashAnim {
            0% { opacity: 0.2; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="flash" id="flash"></div>

    <div class="container">
        <div class="time">
            <span id="hours">00</span><span id="colon" style="opacity:0.3">:</span><span id="minutes">00</span>
            <span class="seconds" id="seconds">00</span>
        </div>

        <div class="bottom-info">
            <div class="date" id="date">MONDAY, JAN 1</div>
            
            <div class="status-badge" id="wakeLockBadge">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                <span id="wakeLockText">Tap to keep screen on</span>
            </div>
        </div>
    </div>

    <script>
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const dateEl = document.getElementById('date');
        const colonEl = document.getElementById('colon');
        const flashEl = document.getElementById('flash');
        const wakeLockBadge = document.getElementById('wakeLockBadge');
        const wakeLockText = document.getElementById('wakeLockText');

        // آرایه‌های تاریخ و ماه
        const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

        const pad = (n) => String(n).padStart(2, '0');

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            
            // فرمت 12 ساعته
            h = h % 12;
            h = h ? h : 12; 

            hoursEl.textContent = pad(h);
            minutesEl.textContent = pad(m);
            secondsEl.textContent = pad(s);

            // چشمک زدن کولون
            if (s % 2 === 0) {
                colonEl.style.opacity = '1';
            } else {
                colonEl.style.opacity = '0.2';
            }

            // تاریخ
            dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;

            requestAnimationFrame(updateClock);
        }

        requestAnimationFrame(updateClock);

        // ================= Wake Lock API =================
        let wakeLock = null;

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLockBadge.classList.add('active');
                    wakeLockText.textContent = 'Screen stays on';
                    
                    wakeLock.addEventListener('release', () => {
                        wakeLockBadge.classList.remove('active');
                        wakeLockText.textContent = 'Tap to keep screen on';
                    });
                } catch (err) {
                    // برخی مرورگرها اجازه نمی‌دهند
                    wakeLockText.textContent = 'Screen lock not allowed';
                }
            } else {
                wakeLockText.textContent = 'Not supported on this browser';
            }
        }

        // لمس صفحه برای فعال کردن حالت روشن ماندن
        document.body.addEventListener('click', () => {
            // افکت فلش
            flashEl.classList.remove('active');
            void flashEl.offsetWidth; // ترفند ری‌استارت انیمیشن
            flashEl.classList.add('active');

            // اگر Wake Lock فعال نیست، فعالش کن
            if (!wakeLock) {
                requestWakeLock();
            }
        });

        // اگر کاربر صفحه را ترک کرد و برگشت، دوباره فعال شود
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // حالت شب و روز (با فشار دادن دو انگشت یا کلیک راست)
        // برای سادگی، با دابل کلیک فعال می‌شود
        document.body.addEventListener('dblclick', () => {
            document.body.classList.toggle('light-mode');
        });

    </script>
</body>
</html>
